<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura</title><style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:#fff;font-family:Arial,sans-serif}.app{max-width:520px;height:100vh;margin:auto;display:flex;flex-direction:column}.head{padding:16px;display:flex;justify-content:space-between;border-bottom:1px solid #283044}.logo{font-size:25px;font-weight:800;color:#fb7185}.content{flex:1;overflow:auto;padding:14px}.card{height:68vh;border-radius:22px;overflow:hidden;position:relative;background:#111827}.card img{width:100%;height:100%;object-fit:cover}.info{position:absolute;inset:40% 0 0;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent,#000)}h2{margin:0;font-size:28px}.tags span{display:inline-block;padding:5px 8px;border:1px solid #ffffff55;border-radius:20px;margin:5px 4px 0 0;font-size:11px}.actions{display:flex;justify-content:center;gap:28px;padding:12px}.actions button{width:58px;height:58px;border:0;border-radius:50%;font-size:25px}.like{background:#f43f5e;color:white}.nav{height:65px;display:flex;justify-content:space-around;border-top:1px solid #283044}.nav button{background:none;border:0;color:#9ca3af}.row{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #283044}.row img{width:50px;height:50px;border-radius:50%;object-fit:cover}.small{font-size:12px;color:#9ca3af}.panel{padding:15px;border:1px solid #4b5563;border-radius:16px;margin-bottom:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px;background:#151c2c;border-radius:14px}.stat b{font-size:22px;display:block;margin-top:5px}.back{background:#7c3aed;color:#fff;border:0;border-radius:10px;padding:10px}</style></head><body><div class="app"><header class="head"><div class="logo">✨ Aura</div><button class="back" onclick="founder()">👑 Kurucu</button></header><main id="content" class="content"></main><nav class="nav"><button onclick="tab='swipe';render()">🔥<br>Keşfet</button><button onclick="tab='matches';render()">💬<br>Sohbet</button><button onclick="tab='profile';render()">👤<br>Profil</button></nav></div><script>const profiles=[{name:'Elif Yılmaz',age:24,city:'İstanbul, Beşiktaş',bio:'Kahve tutkunu, amatör fotoğrafçı ve doğa yürüyüşü sever.',img:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80',tags:['Tasarım','Kahve','Seyahat']},{name:'Can Arslan',age:27,city:'İstanbul, Kadıköy',bio:'Yazılımcı, indie müzik dinleyicisi.',img:'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=800&q=80',tags:['Kodlama','Müzik','Kamp']},{name:'Selin Kaya',age:23,city:'İzmir, Alsancak',bio:'Mimarlık öğrencisi, sanat ve gastronomi meraklısı.',img:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80',tags:['Mimari','Resim','Sinema']}];let tab='swipe',i=0,matches=[];function render(){let c=document.getElementById('content');if(tab==='swipe'){let p=profiles[i%profiles.length];c.innerHTML=`<div class="card"><img src="${p.img}"><div class="info"><h2>${p.name}, ${p.age} ✓</h2><div class="small">📍 ${p.city}</div><p>${p.bio}</p><div class="tags">${p.tags.map(x=>`<span>${x}</span>`).join('')}</div></div></div><div class="actions"><button onclick="next()">✕</button><button>★</button><button class="like" onclick="like()">♥</button></div>`}else if(tab==='matches'){c.innerHTML='<h3>Eşleşmeler & Sohbetler</h3>'+(!matches.length?'<p class="small">Henüz eşleşme yok.</p>':matches.map(p=>`<div class="row"><img src="${p.img}"><div><b>${p.name}</b><div class="small">Yeni bir eşleşmeniz var! 💖</div></div></div>`).join(''))}else if(tab==='profile'){let p=profiles[0];c.innerHTML=`<div style="text-align:center;padding:30px"><img src="${p.img}" style="width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #f43f5e"><h2>${p.name} ✓</h2><p>${p.bio}</p><div class="tags">${p.tags.map(x=>`<span>${x}</span>`).join('')}</div></div>`}else{c.innerHTML=`<div class="panel"><b>👑 KURUCU KONTROL PANELİ</b><h3>Aura Yönetimi</h3><span class="small">● Sistem canlı</span></div><div class="stats"><div class="stat"><span class="small">Toplam Üye</span><b>14.820</b></div><div class="stat"><span class="small">Bugün Aktif</span><b>3.240</b></div><div class="stat"><span class="small">Eşleşmeler</span><b>48.920</b></div><div class="stat"><span class="small">Gelir</span><b>₺124.500</b></div></div><h3>Kullanıcı Yönetimi</h3>${profiles.map(p=>`<div class="row"><img src="${p.img}"><div><b>${p.name} ✓</b><div class="small">Aktif kullanıcı</div></div></div>`).join('')}`}}function next(){i++;render()}function like(){let p=profiles[i%profiles.length];if(!matches.includes(p))matches.push(p);i++;alert('Eşleşme! 💖');render()}function founder(){tab=tab==='founder'?'swipe':'founder';render()}render();</script></body></html>
